<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <!-- Bootstrap.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- 建立一個左窄右寬的layout -->
    <!-- 簡寫法: .container>.row>.col-4{側邊內容}+ .col-8{主要內容} -->
    <div class="container">
        <!-- 巢狀的column - outer -->
        <div class="row">
            <div class="col-4">側邊內容</div>
            <div class="col-8">
                <!-- 巢狀的column - inner -->
                <!-- 在 inner 裡面的 column, 還是會以 12 格為基準，不受到外層的影響 -->

                <!-- 簡寫法: .row>.col-6*2{主要內容 - $$} -->
                <!-- 其中 $$ 是 item numbering 的意思，表示 01, 02 -->
                <div class="row">
                    <div class="col-6">主要內容 - 01</div>
                    <div class="col-6">主要內容 - 02</div>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
