<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- .container>.row>.col-12.col-md-8.mx-auto -->
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-8 mx-auto">
                <form class="needs-validation" action="" method="post" novalidate>
                    <div class="mb-4">
                        <label for="contact_purpose" class="form-label">聯絡目的</label>
                        <select class="form-select" id="contact_purpose" name="contact_purpose" required>
                            <option value="" disabled selected>請選擇聯絡目的</option>
                            <option value="客服專區">客服專區</option>
                            <option value="加盟專區">加盟專區</option>
                            <option value="海外代理">海外代理</option>
                            <option value="異業合作">異業合作</option>
                            <option value="企業採購">企業採購</option>
                            <option value="聯名商品">聯名商品</option>
                        </select>
                        <div class="invalid-feedback">
                            請選擇聯絡目的
                        </div>
                    </div>
                    <!-- css: full-name -->
                    <!-- js:  fullName -->
                    <!-- 資料庫: full_name -->
                    <div class="mb-4">
                        <label for="full_name" class="form-label">姓名</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="請輸入姓名"
                            required>
                        <div class="invalid-feedback">
                            請輸入姓名
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="phone_number" class="form-label">連絡電話</label>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number"
                            placeholder="請輸入連絡電話" required>
                        <div class="invalid-feedback">
                            請輸入連絡電話
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="請輸入Email"
                            required>
                        <div class="invalid-feedback">
                            請輸入有效的Email地址
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="purchase_date" class="form-label">消費時間</label>
                        <input type="date" class="form-control" id="purchase_date" name="purchase_date">
                    </div>

                    <div class="mb-4">
                        <label for="purchase_store" class="form-label">消費門市</label>
                        <select class="form-select" id="purchase_store" name="purchase_store">
                            <option value="" selected>請選擇消費門市 (非必填)</option>
                            <option value="台北信義旗艦店">台北信義旗艦店</option>
                            <option value="台中逢甲概念店">台中逢甲概念店</option>
                            <option value="高雄巨蛋專賣店">高雄巨蛋專賣店</option>
                            <option value="新北板橋文化店">新北板橋文化店</option>
                            <option value="桃園中壢中原店">桃園中壢中原店</option>
                            <option value="台南中西區府前店">台南中西區府前店</option>
                            <option value="新竹東區光復店">新竹東區光復店</option>
                            <option value="基隆仁愛區廟口店">基隆仁愛區廟口店</option>
                            <option value="宜蘭羅東中山店">宜蘭羅東中山店</option>
                            <option value="花蓮吉安中華店">花蓮吉安中華店</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="subject" class="form-label">主旨</label>
                        <input type="text" class="form-control" id="subject" name="subject" placeholder="請簡述您的問題主旨"
                            required>
                        <div class="invalid-feedback">
                            請輸入主旨
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="message_content" class="form-label">內容</label>
                        <textarea class="form-control" id="message_content" name="message_content" rows="5"
                            placeholder="請詳述您的問題或建議" required></textarea>
                        <div class="invalid-feedback">
                            請輸入內容
                        </div>
                    </div>

                    <div class="mb-4">
                        <button type="submit" class="btn btn-primary w-100">送出表單</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- validation.js -->
    <script src="./js/script.js"></script>
</body>

</html>
