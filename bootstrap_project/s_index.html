<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Root</title>
    <!-- bootstrap 設定 -->
    <!-- 參考網頁: https://ayn2110.github.io/bootstrap-builder/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .box-black {
            background-color: black;
            margin-bottom: 10px;
            color: white;
        }

        .bg-black {
            background-color: black;
        }

        .mb-1 {
            margin-bottom: 10px;
        }

        .mb-2 {
            margin-bottom: 20px;
        }

        .mb-3 {
            margin-bottom: 30px;
        }

        .mb-4 {
            margin-bottom: 40px;
        }

        .mb-5 {
            margin-bottom: 50px;
        }

        .p-1 {
            padding: 10px;
        }

        .p-2 {
            padding: 20px;
        }

        .p-3 {
            padding: 30px;
        }

        .p-4 {
            padding: 40px;
        }

        .pt-1 {
            padding-top: 10px;
        }

        .pt-2 {
            padding-top: 20px;
        }

        .pt-3 {
            padding-top: 30px;
        }

        .pt-4 {
            padding-top: 40px;
        }

        .text-white {
            color: white;
        }

        /* text-primary 是 主要文字顏色 */
        .text-primary {
            color: chocolate;
        }
    </style>
</head>

<body>
    <!-- 容器 > 列 > 欄[屬性]{文字} -->
    <!-- 簡寫法： .container>.row>.col>.bg-primary{Banner} -->
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="bg-primary">Banner</div>
            </div>
        </div>
    </div>

    <!-- 兩欄式 -->
    <!-- .container>.row>.col*2>.bg-secondary{Banner Secondary} -->
    <div class="container-fluid mb-5">
        <div class="row">
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
        </div>
    </div>

    <!-- 三欄式 -->
    <!-- 簡寫法: section.container.mb-5>.row>.col*3>.bg-secondary{Banner Secondary} -->
    <section class="container mb-5">
        <div class="row">
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
        </div>
    </section>

    <!-- 四欄式 -->
    <section class="container mb-5">
        <div class="row">
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
            <div class="col">
                <div class="bg-secondary">Banner Secondary</div>
            </div>
        </div>
    </section>

    <!-- 五欄式 -->
    <section class="container mb-5">
        <div class="row">
            <div class="col">
                <div class="bg-secondary"></div>
            </div>
            <div class="col">
                <div class="bg-secondary"></div>
            </div>
            <div class="col">
                <div class="bg-secondary"></div>
            </div>
            <div class="col">
                <div class="bg-secondary"></div>
            </div>
            <div class="col">
                <div class="bg-secondary"></div>
            </div>
        </div>
    </section>


    <!-- bootstrap 設定 -->
    <!-- 參考網站: https://ayn2110.github.io/bootstrap-builder/ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <!-- class 類別 -->
    <div class="box-black">黑盒子</div>
    <div class="box-black">黑盒子</div>
    <div class="box-black">黑盒子</div>
    <p class="box-black">mock-up passage...</p>



</body>

</html>
