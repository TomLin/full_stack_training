<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductPage</title>
    <!-- Bootstrap.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        img {
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- 簡碼寫法: .container>.row>.col-3*5>a>img.img-fluid[src='./imgs/image$$.png'] -->
    <!-- 其中 $$ 是 item numbering 的意思，表示 01, 02, 03, 04, 05 -->
    <div class="container">
        <div class="row">
            <div class="col-3"><a href=""><img src="./imgs/image01.png" alt="" class="img-fluid"></a></div>
            <div class="col-3"><a href=""><img src="./imgs/image02.png" alt="" class="img-fluid"></a></div>
            <div class="col-3"><a href=""><img src="./imgs/image03.png" alt="" class="img-fluid"></a></div>
            <div class="col-3"><a href=""><img src="./imgs/image04.png" alt="" class="img-fluid"></a></div>
            <div class="col-3"><a href=""><img src="./imgs/image05.png" alt="" class="img-fluid"></a></div>
        </div>
    </div>
    <!-- Bootstrap.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
