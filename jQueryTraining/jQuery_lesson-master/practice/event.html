<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event jQuery</title>
    <style>
        .container {
            display: flex;
            width: 800px;
        }

        .word1 {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            width: 300px;
            height: 300px;
            background: tomato;
        }

        .word2 {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            width: 300px;
            height: 300px;
            background: tomato;
        }

        .word3 {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            width: 300px;
            height: 300px;
            background: lightskyblue;
            /* all 代表所有屬性都做動畫 */
            transition: all 0.7s;

        }
    </style>
</head>

<body>
    <div class="container">
        <p class="word1">今天天氣很好</p>
        <p class="word2">jQuery超好玩</p>
        <p class="word3">Box3</p>
    </div>
    <select name="fruit" id="fruit">
        <option value="蘋果">蘋果</option>
        <option value="草莓">草莓</option>
        <option value="香蕉">香蕉</option>
        <option value="芭樂">芭樂</option>
        <option value="水蜜桃">水蜜桃</option>
    </select>
    <p class="list">您選擇的水果是蘋果</p>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $(".word1").on("dblclick", function () {
                // this 代表被點擊的元素
                $(this).css("background", "lightgreen");

                // 改變別的元素
                $(".word2").css("background", "lightpink");
            });

            // mouseenter 滑鼠移入
            // mouseleave 滑鼠移出

            // 一個選取器合併兩個events寫法
            $(".word3").on("mouseenter", function () {
                $(this).css(
                    {
                        "background": "purple",
                        "color": "white",
                        "width": "500px"
                    }
                );
            })
                .on("mouseleave", function () {
                    $(this).css(
                        {
                            "background": "lightskyblue",
                            "color": "black",
                            "width": "300px"
                        });
                });
        });

    </script>
</body>

</html>
