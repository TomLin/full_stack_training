<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Image</title>
    <style>
        .container {
            width: 1200px;
            margin: 100px auto;
            background-color: lightyellow;
            padding: 30px;
        }

        /* CSS Scan: 會提供很多可愛的 button CSS 的樣式 */
        /* https://getcssscan.com/css-buttons-examples */
        .button-27 {
            appearance: none;
            background-color: #000000;
            border: 2px solid #1A1A1A;
            border-radius: 15px;
            box-sizing: border-box;
            color: #FFFFFF;
            cursor: pointer;
            display: inline-block;
            font-family: Roobert, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            font-size: 16px;
            font-weight: 600;
            line-height: normal;
            margin: 10px 0;
            min-height: 60px;
            min-width: 0;
            outline: none;
            padding: 16px 24px;
            text-align: center;
            text-decoration: none;
            transition: all 300ms cubic-bezier(.23, 1, 0.32, 1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            width: 10%;
            will-change: transform;
        }

        .button-27:disabled {
            pointer-events: none;
        }

        .button-27:hover {
            box-shadow: rgba(0, 0, 0, 0.25) 0 8px 15px;
            transform: translateY(-2px);
        }

        .button-27:active {
            box-shadow: none;
            transform: translateY(0);
        }

        .pic {
            margin-right: 20px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid pink;
        }
    </style>
</head>

<body>
    <div class="container">
        <button id="Add" class="button-27">新增圖片</button>
        <button id="Remove" class="button-27">移除圖片</button>
        <div class="img-list">
            <img class="pic" src="imgs/christmas-bell.png" alt="">
            <img class="pic" src="imgs/christmas-lights.png" alt="">
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        /*

        你可以使用以下兩種方式來確保你的 jQuery 程式碼在 DOM 完全加載後執行：
    
        $(document).ready(function() {
            // 你的jQuery程式碼放在這裡
        });

        它的簡寫形式：
        $(function() {
            // 你的jQuery程式碼放在這裡
        });

        */


        $(function () {

            let img_arr = [
                "imgs/christmas-bell.png",
                "imgs/christmas-lights.png",
                "imgs/mistletoe.png",
                "imgs/snowman.png",
                "imgs/presents.png"
            ];

            console.log(img_arr[0]);

            let i = 0;

            $("#Add").on("click", function () {
                $(".img-list").append(`<img class="pic" src="${img_arr[i]}" alt="">`);
                i++;

                // 當 i 超過陣列長度時，重設為 0
                if (i >= img_arr.length) {
                    i = 0;
                }
            });

            $("#Remove").on("click", function () {
                let len = $(".pic").length;
                $(".pic").eq(len - 1).remove();
            });

        });


    </script>
</body>

</html>
