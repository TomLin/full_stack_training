<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動畫方法練習</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: beige;
        }

        .box {
            width: 200px;
            height: 300px;
            background-color: chocolate;
            position: absolute;
            left: -200px;
            /* transition: all 0.3s; */
        }

        .box a {
            width: 100%;
            height: 40px;
            display: flex;
            color: white;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border-bottom: 1px dashed #ddd;
        }

        .menu {
            width: 40px;
            height: 40px;
            background-color: tomato;
            position: absolute;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="menu"><i class="fa-solid fa-bars"></i></div>
    <div class="box">
        <a href="">香草冰淇淋</a>
        <a href="">草莓冰淇淋</a>
        <a href="">巧克力冰淇淋</a>
        <a href="">抹茶冰淇淋</a>
        <a href="">開心果冰淇淋</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            // slideDown
            //$('.box').hide();
            let is_open = false; //設定選單預設關閉
            $('.menu').on("click", function () {
                if (!is_open) {
                    $('.box').animate({
                        left: '0px'
                    }, 500)
                    is_open = true;
                } else {
                    $('.box').animate({
                        left: '-200px'
                    }, 500)
                    is_open = false;
                }
                //$('.box').slideToggle();
            })


            // slideToggle

            // animate
        })
    </script>
</body>

</html>
